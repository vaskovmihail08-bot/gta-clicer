<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA VI Clicker — Vice City Hustle</title>
<style>
  :root{
    --neon-pink:#ff2e97; --neon-cyan:#00f0ff; --neon-purple:#a855f7;
    --neon-yellow:#ffe14d; --neon-green:#39ff88; --bg-dark:#0a0416;
    --bg-panel:rgba(20,8,40,0.90); --glass:rgba(255,255,255,0.08);
    --glass-strong:rgba(255,255,255,0.15); --border-glow:rgba(255,46,151,0.55);
    --text-main:#f4eaff; --text-dim:#b9a8d6; --radius:18px;
    --font:'Segoe UI','Trebuchet MS',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:var(--font);background:var(--bg-dark);color:var(--text-main);user-select:none;position:relative;}

  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
  #bg-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;
    background: radial-gradient(ellipse at 20% 0%, rgba(255,46,151,0.18), transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(0,240,255,0.14), transparent 55%),
                radial-gradient(ellipse at 50% 110%, rgba(168,85,247,0.20), transparent 60%),
                linear-gradient(180deg, rgba(10,4,22,0.15) 0%, rgba(10,4,22,0.55) 70%, rgba(10,4,22,0.92) 100%);}

  /* ГЛАВНОЕ МЕНЮ */
  #main-menu {
    position: fixed; inset: 0; z-index: 2000; background: var(--bg-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; transition: opacity 0.3s;
  }
  #main-menu h1 {
    font-size: clamp(32px, 6vw, 64px); font-weight: 900; letter-spacing: 4px;
    text-transform: uppercase; text-align: center; line-height: 1.1;
    background: linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255,46,151,0.5)); margin-bottom: 20px;
  }
  .menu-btn {
    width: 280px; padding: 16px; font-size: 18px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 2px; border-radius: 12px;
    background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1);
    color: white; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .menu-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--neon-pink); transform: scale(1.05); }
  .menu-btn.primary { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); border: none; box-shadow: 0 0 20px rgba(255,46,151,0.4); }
  .menu-btn.primary:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255,46,151,0.6); }

  /* НАСТРОЙКИ */
  #settings-panel {
    position: fixed; inset: 0; z-index: 2001; background: rgba(0,0,0,0.9);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  }

  /* ИГРОВОЙ ИНТЕРФЕЙС */
  #game-ui { position: relative; z-index: 2; height: 100%; display: grid;
    grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr;
    grid-template-areas: "header header" "main side"; gap: 16px; padding: 16px;
    max-width: 1600px; margin: 0 auto; display: none; /* Скрыто до старта */ }

  header{grid-area:header;display:flex;align-items:center;justify-content:space-between;
    gap:14px;flex-wrap:wrap;background:var(--bg-panel);border:1px solid var(--border-glow);
    border-radius:var(--radius);padding:12px 20px;backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 0 32px rgba(255,46,151,0.22), inset 0 1px 0 var(--glass-strong);}

  .logo{font-size:clamp(18px,2.2vw,28px);font-weight:900;letter-spacing:2px;
    text-transform:uppercase;background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan),var(--neon-pink));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;white-space:nowrap;cursor:pointer;}
  
  .header-stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .stat-pill{background:linear-gradient(135deg,rgba(255,46,151,0.2),rgba(0,240,255,0.15));
    border:1px solid rgba(255,255,255,0.18);border-radius:999px;padding:8px 16px;
    display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;
    box-shadow:inset 0 1px 0 var(--glass-strong),0 0 20px rgba(0,240,255,0.15);
    white-space:nowrap;transition:transform .15s;}
  .stat-pill .ico{font-size:18px;filter:drop-shadow(0 0 8px currentColor);}
  .stat-pill.cash{color:var(--neon-green);border-color:rgba(57,255,136,0.5);}
  .stat-pill.heat{color:var(--neon-pink);border-color:rgba(255,46,151,0.55);}
  .stat-pill.respect{color:var(--neon-yellow);border-color:rgba(255,225,77,0.5);}
  .stat-pill.clicks{color:var(--neon-cyan);border-color:rgba(0,240,255,0.5);}
  .stat-pill.bump{animation:bump .25s ease;}
  @keyframes bump{50%{transform:scale(1.1);}}

  main{grid-area:main;position:relative;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:20px;min-height:0;}

  #click-stage{position:relative;width:min(100%,500px);aspect-ratio:1/1;max-height:100%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}

  .neon-ring{position:absolute;inset:6%;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,46,151,0.3),transparent 60%),
               radial-gradient(circle at 70% 70%,rgba(0,240,255,0.25),transparent 60%);
    box-shadow:0 0 70px rgba(255,46,151,0.4),0 0 140px rgba(0,240,255,0.25),
               inset 0 0 90px rgba(168,85,247,0.3);
    animation:ringPulse 3.5s ease-in-out infinite;}
  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.04);opacity:1;}}
  .neon-ring::before{content:'';position:absolute;inset:-4px;border-radius:50%;padding:4px;
    background:conic-gradient(from 0deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan),var(--neon-purple),var(--neon-pink));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:spin 8s linear infinite;opacity:1;}
  @keyframes spin{to{transform:rotate(360deg);}}

  #click-target{position:relative;width:62%;height:62%;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(70px,16vw,150px);
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.25),transparent 50%),
               linear-gradient(145deg,rgba(255,46,151,0.4),rgba(0,240,255,0.25) 55%,rgba(168,85,247,0.4));
    border:2px solid rgba(255,255,255,0.4);
    box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 80px rgba(255,46,151,0.5),
               inset 0 0 50px rgba(255,255,255,0.2),inset 0 -20px 40px rgba(0,0,0,0.4);
    transition:transform .08s cubic-bezier(.34,1.56,.64,1),box-shadow .12s;
    will-change:transform;filter:drop-shadow(0 0 20px rgba(255,225,77,0.5));
    animation:floaty 4s ease-in-out infinite;}
  #click-target::after{content:'';position:absolute;inset:-15%;border-radius:50%;
    border:2px dashed rgba(255,255,255,0.2);animation:spin 22s linear infinite reverse;}
  @keyframes floaty{0%,100%{translate:0 -6px;}50%{translate:0 6px;}}
  #click-target.pressed{transform:scale(0.92);}

  .combo-wrap{width:min(100%,420px);text-align:center;}
  .combo-label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);
    margin-bottom:8px;display:flex;justify-content:space-between;font-weight:800;}
  .combo-label b{color:var(--neon-yellow);text-shadow:0 0 12px rgba(255,225,77,0.7);font-size:14px;}
  .combo-track{height:12px;border-radius:999px;background:rgba(255,255,255,0.1);
    overflow:hidden;border:1px solid rgba(255,255,255,0.15);}
  .combo-fill{height:100%;width:0%;border-radius:999px;
    background:linear-gradient(90deg,var(--neon-cyan),var(--neon-yellow),var(--neon-pink));
    box-shadow:0 0 20px rgba(255,225,77,0.7);transition:width .12s linear;}

  .hint{font-size:13px;color:var(--text-dim);text-align:center;letter-spacing:1px;
    text-transform:uppercase;opacity:.8;font-weight:600;}

  .float-num{position:absolute;font-weight:900;font-size:clamp(20px,3.5vw,32px);
    color:var(--neon-green);text-shadow:0 0 15px rgba(57,255,136,1),0 2px 0 rgba(0,0,0,0.5);
    pointer-events:none;z-index:50;white-space:nowrap;
    animation:floatUp .95s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}
    20%{opacity:1;transform:translate(-50%,-70%) scale(1.2);}
    100%{opacity:0;transform:translate(-50%,-250%) scale(1);}}

  .spark{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:49;}

  aside{grid-area:side;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:hidden;}
  .panel{background:var(--bg-panel);border:1px solid rgba(255,255,255,0.15);border-radius:var(--radius);
    padding:16px;backdrop-filter:blur(20px) saturate(150%);
    box-shadow:0 10px 40px rgba(0,0,0,0.4),inset 0 1px 0 var(--glass-strong);
    display:flex;flex-direction:column;min-height:0;}
  .panel-title{font-size:14px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
    color:var(--neon-cyan);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .panel-title::after{content:'';flex:1;height:2px;background:linear-gradient(90deg,rgba(0,240,255,0.6),transparent);}

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .tab{padding:12px 6px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid transparent;
    color:var(--text-dim);font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;
    cursor:pointer;transition:all .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .tab .tab-icon { font-size: 20px; }
  .tab:hover{background:rgba(255,255,255,0.12);color:var(--text-main);}
  .tab.active{background:linear-gradient(135deg,rgba(255,46,151,0.4),rgba(0,240,255,0.25));
    color:#fff;border-color:rgba(255,255,255,0.3);
    box-shadow:0 0 25px rgba(255,46,151,0.4),inset 0 1px 0 rgba(255,255,255,0.3);}
  
  .tab-content{display:none;overflow-y:auto;flex:1;min-height:0;padding-right:6px;}
  .tab-content.active{display:block;}
  .tab-content::-webkit-scrollbar{width:8px;}
  .tab-content::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:4px;}
  .tab-content::-webkit-scrollbar-thumb{background:linear-gradient(var(--neon-pink),var(--neon-cyan));border-radius:4px;}

  /* УЛУЧШЕННЫЕ КАРТОЧКИ АПГРЕЙДОВ */
  .upg-card{background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.03));
    border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:14px;margin-bottom:12px;
    display:flex;align-items:center;gap:14px;transition:all .2s;position:relative;overflow:hidden;}
  .upg-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(var(--neon-pink),var(--neon-cyan));opacity:1;}
  .upg-icon{width:50px;height:50px;flex-shrink:0;border-radius:14px;display:flex;
    align-items:center;justify-content:center;font-size:28px;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.25),rgba(255,46,151,0.2));
    border:1px solid rgba(255,255,255,0.2);box-shadow:inset 0 1px 0 rgba(255,255,255,0.3);}
  .upg-info{flex:1;min-width:0;margin-bottom: 6px;}
  .upg-name{font-size:15px;font-weight:900;margin-bottom:4px;color:#fff;}
  .upg-desc{font-size:12px;color:var(--text-dim);line-height:1.4;margin-bottom:6px;}
  .upg-level{position:absolute;top:10px;right:12px;font-size:11px;font-weight:900;
    background:rgba(0,240,255,0.2);color:var(--neon-cyan);border:1px solid rgba(0,240,255,0.4);
    border-radius:999px;padding:3px 10px;}
  
  /* Кнопка КУПИТЬ */
  .buy-btn {
    width: 100%; padding: 10px; margin-top: 6px; border: none; border-radius: 10px;
    font-weight: 900; font-size: 14px; cursor: pointer; transition: all 0.2s;
    color: #0a0416; background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
    box-shadow: 0 4px 15px rgba(57,255,136,0.3);
  }
  .buy-btn:active { transform: scale(0.95); }
  .buy-btn:disabled {
    background: #333; color: #777; cursor: not-allowed; box-shadow: none;
  }

  .prestige-box{text-align:center;padding:8px 0;}
  .prestige-box .big{font-size:50px;margin-bottom:8px;filter:drop-shadow(0 0 25px rgba(255,225,77,0.7));}
  .prestige-box h3{font-size:16px;margin-bottom:8px;color:var(--neon-yellow);letter-spacing:1px;}
  .prestige-box p{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}

  .btn{border:none;border-radius:16px;padding:15px 20px;width:100%;font-family:var(--font);
    font-weight:900;font-size:14px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
    transition:all .2s;color:#0a0416;background:linear-gradient(135deg,var(--neon-yellow),var(--neon-pink));
    box-shadow:0 8px 25px rgba(255,46,151,0.4);}
  .btn:active:not(:disabled){transform:scale(.97);}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.7);box-shadow:none;}

  .ach{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;
    border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
    font-size:12px;transition:all .2s;}
  .ach.unlocked{background:linear-gradient(135deg,rgba(255,225,77,0.15),rgba(255,46,151,0.1));
    border-color:rgba(255,225,77,0.5);box-shadow:0 0 20px rgba(255,225,77,0.2);}
  .ach .em{font-size:24px;filter:grayscale(1);opacity:.4;}
  .ach.unlocked .em{filter:none;opacity:1;filter:drop-shadow(0 0 10px rgba(255,225,77,0.8));}
  .ach .txt{flex:1;line-height:1.4;}
  .ach .txt b{display:block;color:#fff;font-size:14px;margin-bottom:2px;}
  .ach .txt span{color:var(--text-dim);font-size:11px;}

  #toasts{position:fixed;top:90px;right:20px;z-index:2500;display:flex;flex-direction:column;
    gap:10px;pointer-events:none;max-width:320px;}
  .toast{background:linear-gradient(135deg,rgba(20,8,40,0.95),rgba(40,10,60,0.95));
    border:1px solid var(--neon-yellow);border-radius:14px;padding:12px 16px;
    box-shadow:0 0 30px rgba(255,225,77,0.4);font-size:13px;font-weight:800;
    animation:toastIn .4s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:12px;}
  .toast .em{font-size:24px;}
  @keyframes toastIn{from{opacity:0;transform:translateX(60px);}to{opacity:1;transform:none;}}
  .toast.out{animation:toastOut .4s ease forwards;}
  @keyframes toastOut{to{opacity:0;transform:translateX(60px);}}

  #flash{position:fixed;inset:0;z-index:900;pointer-events:none;
    background:radial-gradient(circle,rgba(255,225,77,0.35),transparent 70%);opacity:0;}
  #flash.go{animation:flashAnim .45s ease-out;}
  @keyframes flashAnim{0%{opacity:0;}20%{opacity:1;}100%{opacity:0;}}

  #save-indicator{position:fixed;bottom:16px;left:16px;z-index:500;font-size:11px;
    color:var(--text-dim);background:rgba(10,4,22,0.8);border:1px solid rgba(255,255,255,0.15);
    border-radius:999px;padding:8px 14px;opacity:0;transition:opacity .3s;}
  #save-indicator.show{opacity:1;}

  #profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2002; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
  .modal-content { background: #120724; padding: 24px; border-radius: 20px; border: 2px solid var(--neon-pink); width: 90%; max-width: 420px; box-shadow: 0 0 60px rgba(255,46,151,0.5); }
  .modal-content h2 { color: var(--neon-cyan); margin-bottom: 20px; text-transform: uppercase; }
  .modal-content label { display: block; color: white; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
  .modal-content input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #0a0416; color: white; margin-bottom: 20px; font-family: var(--font); }
  .modal-buttons { display: flex; gap: 12px; }

  @media (max-width:980px){
    #game-ui{grid-template-columns:1fr;grid-template-rows:auto minmax(300px,1fr) auto;
      grid-template-areas:"header" "main" "side";padding:12px;gap:12px;overflow-y:auto;}
    body{overflow:auto;}
    html,body{height:auto;min-height:100%;}
    aside{max-height:none;}
    .panel{max-height:450px;}
    #click-stage{max-height:min(70vw,420px);}
    .tabs { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="bg-overlay"></div>
<div id="flash"></div>
<div id="toasts"></div>
<div id="save-indicator">💾 Сохранено</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu">
  <h1>GTA VI<br>Clicker</h1>
  <button class="menu-btn primary" id="btn-start">▶ Играть</button>
  <button class="menu-btn" id="btn-settings">⚙ Настройки</button>
  <button class="menu-btn" id="btn-about">ℹ Об игре</button>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings-panel">
  <h1 style="color:var(--neon-cyan); margin-bottom: 20px;">Настройки</h1>
  <button class="menu-btn" id="btn-toggle-sound">🔊 Звук: ВКЛ</button>
  <button class="menu-btn" id="btn-reset" style="border-color: #ff4444; color: #ff4444;">🗑 Сбросить прогресс</button>
  <button class="menu-btn" id="btn-close-settings">← Назад</button>
</div>

<!-- ИГРА -->
<div id="game-ui">
  <header>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="stat-pill" id="btn-menu" style="cursor:pointer; background:#555; color:white; border:none; padding:8px 16px; font-size:14px;">☰ Меню</button>
      <div class="logo">🌴 GTA VI Clicker</div>
    </div>
    <div class="header-stats">
      <button class="stat-pill" id="profile-btn" style="cursor:pointer; background:#a855f7; color:white; border:none; padding:8px 16px;">👤 Профиль</button>
      <div class="stat-pill cash" id="pill-cash"><span class="ico">💵</span><span id="stat-cash">$0</span></div>
      <div class="stat-pill clicks" id="pill-clicks"><span class="ico">👆</span><span id="stat-clicks">0</span></div>
      <div class="stat-pill heat" id="pill-heat"><span class="ico">🔥</span><span id="stat-heat">x1.0</span></div>
      <div class="stat-pill respect" id="pill-respect"><span class="ico">⭐</span><span id="stat-respect">0</span></div>
    </div>
  </header>

  <main>
    <div id="click-stage">
      <div class="neon-ring"></div>
      <div id="click-target">🌴</div>
    </div>
    <div class="combo-wrap">
      <div class="combo-label"><span>Комбо</span><b id="combo-text">x1.0</b></div>
      <div class="combo-track"><div class="combo-fill" id="combo-fill"></div></div>
    </div>
    <div class="hint">Кликай по пальме</div>
  </main>

  <aside>
    <div class="panel">
      <div class="panel-title">🏙️ Бизнес-Империя</div>
      <div class="tabs">
        <div class="tab active" data-tab="upgrades"><span class="tab-icon">⚔️</span>Апгрейды</div>
        <div class="tab" data-tab="business"><span class="tab-icon">🏢</span>Бизнес</div>
        <div class="tab" data-tab="achievements"><span class="tab-icon">🏆</span>Ачивки</div>
      </div>
      <div class="tab-content active" id="tab-upgrades"></div>
      <div class="tab-content" id="tab-business"></div>
      <div class="tab-content" id="tab-achievements"></div>
    </div>

    <div class="panel" style="flex-shrink:0;">
      <div class="panel-title">💎 Ограбление века</div>
      <div class="prestige-box">
        <div class="big">🏦</div>
        <h3>Сбросить прогресс за Respect</h3>
        <p>Обнули бабки и апгрейды, получи <b id="prestige-gain">0</b> Respect.</p>
        <button class="btn" id="prestige-btn" disabled>Ограбить город</button>
      </div>
    </div>
  </aside>
</div>

<div id="profile-modal">
  <div class="modal-content">
    <h2>Твой Профиль</h2>
    <label>Никнейм:</label>
    <input type="text" id="input-nick" placeholder="Введи ник...">
    <div class="modal-buttons">
      <button class="btn" id="save-profile">Сохранить</button>
      <button class="btn" id="close-modal" style="background:#444; color:white;">Закрыть</button>
    </div>
  </div>
</div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const SUFFIXES = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return Math.floor(n).toLocaleString('ru-RU');
  const tier = Math.floor(Math.log10(n)/3);
  if (tier >= SUFFIXES.length) return n.toExponential(2).replace('+','');
  const scaled = n / Math.pow(1000, tier);
  return scaled.toFixed(scaled < 10 ? 2 : scaled < 100 ? 1 : 0) + SUFFIXES[tier];
}

const SAVE_KEY = 'gta6_clicker_vice_v4';

const DEFAULT_STATE = {
  cash: 0, totalCash: 0, respect: 0, prestigeCount: 0,
  clicks: 0, combo: 0, comboTimer: 0,
  upgrades: {}, businesses: {}, achievements: {},
  lastTick: Date.now(),
  soundOn: true,
  profile: { nickname: 'Игрок_' + Math.floor(Math.random() * 9999), password: '' }
};

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const s = JSON.parse(raw);
    const merged = JSON.parse(JSON.stringify(DEFAULT_STATE));
    for (const k in s) {
      if (k === 'profile') merged.profile = Object.assign(merged.profile, s.profile);
      else merged[k] = s[k];
    }
    return merged;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}

let state = loadState();

const UPGRADES = [
  {id:'knuckles', name:'Кастет',            icon:'👊', desc:'+1 к силе клика',    baseCost:15,    growth:1.15, power:1,      max:200},
  {id:'bat',      name:'Бейсбольная бита',  icon:'🏏', desc:'+3 к силе клика',    baseCost:120,   growth:1.16, power:3,      max:200},
  {id:'pistol',   name:'Пистолет',          icon:'🔫', desc:'+12 к силе клика',   baseCost:1100,  growth:1.17, power:12,     max:200},
  {id:'smg',      name:'Пистолет-пулемёт',  icon:'💥', desc:'+60 к силе клика',   baseCost:12000, growth:1.18, power:60,     max:200},
  {id:'rifle',    name:'Автомат',           icon:'🎯', desc:'+350 к силе клика',  baseCost:150000,growth:1.19, power:350,    max:200}
];

const BUSINESSES = [
  {id:'hotdog',  name:'Хот-дог киоск',   icon:'🌭', desc:'+1 $/сек',    baseCost:50,    growth:1.14, income:1,      max:300},
  {id:'bar',     name:'Бар на пляже',    icon:'🍹', desc:'+6 $/сек',    baseCost:600,   growth:1.15, income:6,      max:300},
  {id:'club',    name:'Ночной клуб',     icon:'🎉', desc:'+35 $/сек',   baseCost:7500,  growth:1.16, income:35,     max:300}
];

const ACHIEVEMENTS = [
  {id:'click1',    name:'Первый клик',      desc:'Сделать 1 клик',            check:s=>s.clicks>=1},
  {id:'click100',  name:'Разминка',         desc:'100 кликов',                check:s=>s.clicks>=100},
  {id:'cash1k',    name:'Первая штука',     desc:'Заработать $1K',            check:s=>s.totalCash>=1e3}
];

function getUpgradeCost(u) { return Math.floor(u.baseCost * Math.pow(u.growth, state.upgrades[u.id] || 0)); }
function getBusinessCost(b) { return Math.floor(b.baseCost * Math.pow(b.growth, state.businesses[b.id] || 0)); }

function getClickPower() {
  let power = 1;
  UPGRADES.forEach(u => { power += u.power * (state.upgrades[u.id] || 0); });
  return power * (1 + state.prestigeCount * 0.5);
}

function getIncomePerSec() {
  let income = 0;
  BUSINESSES.forEach(b => { income += b.income * (state.businesses[b.id] || 0); });
  return income * (1 + state.prestigeCount * 0.5);
}

// Элементы
const elCash = $('#stat-cash'), elClicks = $('#stat-clicks'), elHeat = $('#stat-heat');
const elRespect = $('#stat-respect'), elPrestigeGain = $('#prestige-gain'), elPrestigeBtn = $('#prestige-btn');
const elComboText = $('#combo-text'), elComboFill = $('#combo-fill');
const elClickTarget = $('#click-target'), elStage = $('#click-stage');
const elTabUpgrades = $('#tab-upgrades'), elTabBusiness = $('#tab-business'), elTabAch = $('#tab-achievements');

let audioCtx = null;
function playSound(freq, type, vol) {
  if (!state.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  }catch(e){}
}

function bumpPill(el) {
  const pill = el.closest('.stat-pill');
  if(!pill) return;
  pill.classList.remove('bump'); void pill.offsetWidth; pill.classList.add('bump');
}

function spawnFloatNum(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float-num'; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  elStage.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function spawnSparks(x, y) {
  for(let i=0; i<8; i++){
    const s = document.createElement('div'); s.className = 'spark';
    const color = Math.random() > 0.5 ? 'var(--neon-yellow)' : 'var(--neon-pink)';
    s.style.background = color; s.style.boxShadow = '0 0 12px ' + color;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    elStage.appendChild(s);
    const angle = Math.random() * Math.PI * 2; const dist = 40 + Math.random() * 80;
    s.animate([
      { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(0)`, opacity: 0 }
    ], { duration: 500 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.2,1)' }).onfinish = () => s.remove();
  }
}

function handleClick(e) {
  e.preventDefault();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  
  state.clicks++; state.combo++; state.comboTimer = 2.0;
  const comboMult = 1 + Math.min(state.combo, 100) * 0.04;
  const power = getClickPower() * comboMult;
  state.cash += power; state.totalCash += power;
  
  playSound(600 + Math.random() * 400, 'triangle', 0.08);
  
  const rect = elStage.getBoundingClientRect();
  const x = e.clientX - rect.left; const y = e.clientY - rect.top;
  spawnFloatNum(x, y, '+' + fmt(power)); spawnSparks(x, y);
  
  elClickTarget.classList.remove('pressed'); void elClickTarget.offsetWidth; elClickTarget.classList.add('pressed');
  
  if(state.combo % 10 === 0) {
    $('#flash').classList.remove('go'); void $('#flash').offsetWidth; $('#flash').classList.add('go');
    bumpPill(elHeat);
  }
  updateUI();
}

function buyUpgrade(u) {
  const lvl = state.upgrades[u.id] || 0;
  if (lvl >= u.max) return;
  const cost = getUpgradeCost(u);
  if (state.cash < cost) return;
  state.cash -= cost; state.upgrades[u.id] = lvl + 1;
  playSound(300, 'sine', 0.1);
  renderUpgrades(); updateUI();
}

function buyBusiness(b) {
  const lvl = state.businesses[b.id] || 0;
  if (lvl >= b.max) return;
  const cost = getBusinessCost(b);
  if (state.cash < cost) return;
  state.cash -= cost; state.businesses[b.id] = lvl + 1;
  playSound(300, 'sine', 0.1);
  renderBusinesses(); updateUI();
}

function doPrestige() {
  const total = state.totalCash;
  if (total < 1e6) return;
  const gain = Math.floor(Math.pow(total / 1e6, 0.6));
  state.respect += gain; state.prestigeCount++;
  state.cash = 0; state.totalCash = 0; state.upgrades = {}; state.businesses = {};
  playSound(300, 'sine', 0.1);
  renderUpgrades(); renderBusinesses(); updateUI();
  toast('🏦', `Ограбление успешно! +${gain} Respect`);
}

function renderUpgrades() {
  let html = '';
  UPGRADES.forEach(u => {
    const lvl = state.upgrades[u.id] || 0;
    const cost = getUpgradeCost(u);
    const canAfford = state.cash >= cost && lvl < u.max;
    
    html += `
      <div class="upg-card">
        <div class="upg-icon">${u.icon}</div>
        <div class="upg-info">
          <div class="upg-name">${u.name}</div>
          <div class="upg-desc">${u.desc}</div>
          <div style="color:var(--neon-green); font-size:13px; font-weight:900;">💵 ${fmt(cost)}</div>
          <button class="buy-btn" ${canAfford ? '' : 'disabled'} data-id="${u.id}" data-type="upgrade">КУПИТЬ</button>
        </div>
        ${lvl > 0 ? `<div class="upg-level">Lv.${lvl}</div>` : ''}
      </div>
    `;
  });
  elTabUpgrades.innerHTML = html;
}

function renderBusinesses() {
  let html = '';
  BUSINESSES.forEach(b => {
    const lvl = state.businesses[b.id] || 0;
    const cost = getBusinessCost(b);
    const canAfford = state.cash >= cost && lvl < b.max;
    
    html += `
      <div class="upg-card">
        <div class="upg-icon">${b.icon}</div>
        <div class="upg-info">
          <div class="upg-name">${b.name}</div>
          <div class="upg-desc">${b.desc}</div>
          <div style="color:var(--neon-green); font-size:13px; font-weight:900;">💵 ${fmt(cost)}</div>
          <button class="buy-btn" ${canAfford ? '' : 'disabled'} data-id="${b.id}" data-type="business">КУПИТЬ</button>
        </div>
        ${lvl > 0 ? `<div class="upg-level">Lv.${lvl}</div>` : ''}
      </div>
    `;
  });
  elTabBusiness.innerHTML = html;
}

function renderAchievements() {
  let html = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = state.achievements[a.id];
    html += `
      <div class="ach ${unlocked ? 'unlocked' : ''}">
        <div class="em">${unlocked ? '🏆' : '🔒'}</div>
        <div class="txt"><b>${a.name}</b><span>${a.desc}</span></div>
      </div>
    `;
  });
  elTabAch.innerHTML = html;
}

function checkAchievements() {
  let changed = false;
  ACHIEVEMENTS.forEach(a => {
    if(!state.achievements[a.id] && a.check(state)){
      state.achievements[a.id] = true; changed = true;
      toast('🏆', `Ачивка: ${a.name}`);
    }
  });
  if(changed) renderAchievements();
}

function toast(icon, text) {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = `<span class="em">${icon}</span><span>${text}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 3000);
}

let uiTick = 0;
function updateUI() {
  if(elCash.textContent !== '$' + fmt(state.cash)){ elCash.textContent = '$' + fmt(state.cash); bumpPill(elCash); }
  if(elClicks.textContent !== fmt(state.clicks)){ elClicks.textContent = fmt(state.clicks); bumpPill(elClicks); }
  
  const comboMult = 1 + Math.min(state.combo, 100) * 0.04;
  elHeat.textContent = 'x' + comboMult.toFixed(1);
  elComboText.textContent = 'x' + comboMult.toFixed(1);
  elComboFill.style.width = Math.min(100, (state.combo / 100) * 100) + '%';
  elRespect.textContent = fmt(state.respect);
  
  const gain = state.totalCash < 1e6 ? 0 : Math.floor(Math.pow(state.totalCash / 1e6, 0.6));
  elPrestigeGain.textContent = fmt(gain);
  elPrestigeBtn.disabled = gain <= 0;
  
  uiTick++;
  if(uiTick % 15 === 0){
    renderUpgrades();
    renderBusinesses();
    checkAchievements();
  }
}

let lastFrame = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  
  const income = getIncomePerSec();
  if(income > 0){ state.cash += income * dt; state.totalCash += income * dt; }
  
  if(state.combo > 0){
    state.comboTimer -= dt;
    if(state.comboTimer <= 0){ state.combo = 0; state.comboTimer = 0; }
  }
  updateUI();
  requestAnimationFrame(gameLoop);
}

setInterval(() => {
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    const ind = $('#save-indicator');
    ind.classList.add('show');
    setTimeout(() => ind.classList.remove('show'), 1500);
  }catch(e){}
}, 10000);

// ==================== ЛОГИКА ИНТЕРФЕЙСА ====================

// Игра
elStage.addEventListener('mousedown', handleClick);
elStage.addEventListener('touchstart', handleClick, {passive: false});

// Кнопки покупки
elTabUpgrades.addEventListener('click', e => {
  if(e.target.classList.contains('buy-btn') && !e.target.disabled){
    const u = UPGRADES.find(x => x.id === e.target.dataset.id);
    if(u) buyUpgrade(u);
  }
});

elTabBusiness.addEventListener('click', e => {
  if(e.target.classList.contains('buy-btn') && !e.target.disabled){
    const b = BUSINESSES.find(x => x.id === e.target.dataset.id);
    if(b) buyBusiness(b);
  }
});

elPrestigeBtn.addEventListener('click', doPrestige);

$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    $$('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    const target = $('#tab-' + tab.dataset.tab);
    if(target) target.classList.add('active');
  });
});

// Меню
$('#btn-start').addEventListener('click', () => {
  $('#main-menu').style.display = 'none';
  $('#game-ui').style.display = 'grid';
  lastFrame = performance.now();
});

$('#btn-menu').addEventListener('click', () => {
  $('#main-menu').style.display = 'flex';
  $('#game-ui').style.display = 'none';
});

$('#btn-settings').addEventListener('click', () => {
  $('#settings-panel').style.display = 'flex';
  $('#main-menu').style.display = 'none';
});

$('#btn-close-settings').addEventListener('click', () => {
  $('#settings-panel').style.display = 'none';
  $('#main-menu').style.display = 'flex';
});

$('#btn-toggle-sound').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  $('#btn-toggle-sound').textContent = state.soundOn ? '🔊 Звук: ВКЛ' : '🔇 Звук: ВЫКЛ';
});

$('#btn-reset').addEventListener('click', () => {
  if(confirm('Вы уверены? Весь прогресс будет удалён!')){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});

$('#btn-about').addEventListener('click', () => {
  alert('GTA VI Clicker\nРазработчик: Ты\nВерсия: 2.0 (Меню и Кнопки)\n\nИграй, качай, развивайся!');
});

// Профиль
$('#profile-btn').addEventListener('click', () => {
  $('#input-nick').value = state.profile.nickname;
  $('#profile-modal').style.display = 'flex';
});

$('#close-modal').addEventListener('click', () => {
  $('#profile-modal').style.display = 'none';
});

$('#save-profile').addEventListener('click', () => {
  state.profile.nickname = $('#input-nick').value || 'Игрок';
  $('#profile-modal').style.display = 'none';
  toast('✅', 'Профиль обновлён!');
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
});

// Запуск
renderUpgrades();
renderBusinesses();
renderAchievements();
updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>

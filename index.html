<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA VI Clicker — Vice City Hustle</title>
<style>
  :root{
    --neon-pink:#ff2e97; --neon-cyan:#00f0ff; --neon-purple:#a855f7;
    --neon-yellow:#ffe14d; --neon-green:#39ff88; --bg-dark:#0a0416;
    --bg-panel:rgba(20,8,40,0.90); --glass:rgba(255,255,255,0.08);
    --glass-strong:rgba(255,255,255,0.15); --border-glow:rgba(255,46,151,0.55);
    --text-main:#f4eaff; --text-dim:#b9a8d6; --radius:18px;
    --font:'Segoe UI','Trebuchet MS',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden; touch-action: manipulation;}
  body{font-family:var(--font);background:var(--bg-dark);color:var(--text-main);user-select:none;position:relative;}

  /* ФОНОВЫЕ ЭЛЕМЕНТЫ */
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
  #bg-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;
    background: radial-gradient(ellipse at 20% 0%, rgba(255,46,151,0.18), transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(0,240,255,0.14), transparent 55%),
                radial-gradient(ellipse at 50% 110%, rgba(168,85,247,0.20), transparent 60%),
                linear-gradient(180deg, rgba(10,4,22,0.15) 0%, rgba(10,4,22,0.55) 70%, rgba(10,4,22,0.92) 100%);}

  /* МОДАЛЬНОЕ ОКНО ОБНОВЛЕНИЯ */
  #update-modal { display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
  .update-box { background: #120724; padding: 25px; border-radius: 20px; border: 2px solid var(--neon-cyan); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 50px rgba(0,240,255,0.4); }
  .update-box h2 { color: var(--neon-cyan); margin-bottom: 15px; font-size: 22px; text-transform: uppercase; }
  .update-box p { color: var(--text-main); margin-bottom: 20px; font-size: 14px; line-height: 1.5; }
  .update-box button { padding: 12px 20px; border: none; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; text-transform: uppercase; width: 100%; margin-bottom: 10px; color: #0a0416; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green)); box-shadow: 0 0 20px rgba(0,240,255,0.5); }
  .update-box button.cancel { background: #333; color: white; box-shadow: none; }

  /* ГЛАВНОЕ МЕНЮ */
  #main-menu { position: fixed; inset: 0; z-index: 2000; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 0.3s; padding: 20px; }
  #main-menu h1 { font-size: clamp(32px, 8vw, 64px); font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-align: center; line-height: 1.1; background: linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(255,46,151,0.5)); margin-bottom: 20px; }
  .menu-btn { width: 100%; max-width: 300px; padding: 16px; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: white; cursor: pointer; transition: all 0.2s; text-align: center; }
  .menu-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--neon-pink); }
  .menu-btn.primary { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); border: none; box-shadow: 0 0 20px rgba(255,46,151,0.4); }

  /* НАСТРОЙКИ */
  #settings-panel { position: fixed; inset: 0; z-index: 2001; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 20px; }

  /* ИГРОВОЙ ИНТЕРФЕЙС */
  #game-ui { position: relative; z-index: 2; height: 100%; display: none; flex-direction: column; padding: 10px; gap: 10px; max-width: 1600px; margin: 0 auto; overflow: hidden; }

  header{display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;background:var(--bg-panel);border:1px solid var(--border-glow);
    border-radius:var(--radius);padding:10px 15px;backdrop-filter:blur(16px); flex-shrink: 0;}
  
  .logo{font-size:clamp(16px,4vw,24px);font-weight:900;letter-spacing:1px;
    text-transform:uppercase;background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
  
  .header-stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .stat-pill{background:linear-gradient(135deg,rgba(255,46,151,0.2),rgba(0,240,255,0.15));
    border:1px solid rgba(255,255,255,0.18);border-radius:999px;padding:6px 12px;
    display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;
    white-space:nowrap;}
  .stat-pill.cash{color:var(--neon-green);}
  .stat-pill.heat{color:var(--neon-pink);}
  .stat-pill.respect{color:var(--neon-yellow);}
  .stat-pill.clicks{color:var(--neon-cyan);}
  .stat-pill.bump{animation:bump .25s ease;}
  @keyframes bump{50%{transform:scale(1.1);}}

  /* ИГРОВАЯ ЗОНА */
  main{position:relative;display:flex;flex-direction:column; align-items:center;justify-content:center;gap:10px; flex: 1; min-height: 0;}
  #click-stage{position:relative;width:100%;max-width:400px;aspect-ratio:1/1; display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation; flex-shrink: 1;}
  
  .neon-ring{position:absolute;inset:6%;border-radius:50%; border:4px solid rgba(255,46,151,0.3); box-shadow:0 0 40px rgba(255,46,151,0.5), inset 0 0 40px rgba(168,85,247,0.3); animation:ringPulse 3.5s infinite;}
  @keyframes ringPulse{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.05);opacity:1;}}
  
  #click-target{position:relative;width:60%;height:60%;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:clamp(50px,15vw,120px); background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.25),transparent 50%), linear-gradient(145deg,rgba(255,46,151,0.4),rgba(0,240,255,0.25) 55%,rgba(168,85,247,0.4)); border:2px solid rgba(255,255,255,0.4); box-shadow:0 0 50px rgba(255,46,151,0.5); transition:transform .1s; will-change:transform;}
  #click-target.pressed{transform:scale(0.9);}

  .combo-wrap{width:100%;max-width:400px;text-align:center;}
  .combo-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim); display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px;}
  .combo-label b{color:var(--neon-yellow);}
  .combo-track{height:10px;border-radius:999px;background:rgba(255,255,255,0.1); overflow:hidden;}
  .combo-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-yellow),var(--neon-pink)); transition:width .1s linear;}
  
  .float-num{position:absolute;font-weight:900;font-size:24px; color:var(--neon-green);text-shadow:0 0 10px rgba(57,255,136,1); pointer-events:none;z-index:50; animation:floatUp .8s forwards;}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);} 20%{opacity:1;transform:translate(-50%,-70%) scale(1.2);} 100%{opacity:0;transform:translate(-50%,-200%) scale(1);}}
  .spark{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;}

  /* МЕНЮ АПГРЕЙДОВ */
  aside{flex: 0 0 45vh; display:flex;flex-direction:column;gap:10px; overflow:hidden; background:var(--bg-panel); border:1px solid rgba(255,255,255,0.15); border-radius:var(--radius); padding:12px;}
  .panel-title{font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase; color:var(--neon-cyan);margin-bottom:8px;}
  
  .tabs{display:flex; gap:6px; margin-bottom:10px; flex-shrink: 0;}
  .tab{flex: 1; padding:10px 4px; border-radius:10px; background:rgba(255,255,255,0.06); border:none; color:var(--text-dim); font-size:11px; font-weight:900; text-transform:uppercase; cursor:pointer; transition:0.2s; text-align:center;}
  .tab.active{background:linear-gradient(135deg,rgba(255,46,151,0.4),rgba(0,240,255,0.25)); color:#fff; box-shadow:0 0 15px rgba(255,46,151,0.4);}
  
  .tab-content{display:none; overflow-y:auto; flex:1; padding-right:5px; -webkit-overflow-scrolling: touch;}
  .tab-content.active{display:block;}
  .tab-content::-webkit-scrollbar{width:4px;}
  .tab-content::-webkit-scrollbar-thumb{background:var(--neon-pink); border-radius:2px;}

  .upg-card{background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px; margin-bottom:8px; display:flex; align-items:center; gap:10px; position:relative;}
  .upg-icon{width:40px;height:40px;flex-shrink:0;border-radius:10px;display:flex; align-items:center;justify-content:center;font-size:20px; background:rgba(255,255,255,0.1);}
  .upg-info{flex:1;min-width:0;}
  .upg-name{font-size:13px;font-weight:900;color:#fff;margin-bottom:2px;}
  .upg-desc{font-size:10px;color:var(--text-dim);margin-bottom:4px;}
  .upg-cost{font-size:12px;font-weight:900;color:var(--neon-green);margin-bottom:6px;}
  
  .buy-btn { width: 100%; padding: 8px; border: none; border-radius: 8px; font-weight: 900; font-size: 12px; color: #0a0416; background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan)); }
  .buy-btn:active { transform: scale(0.95); }
  .buy-btn:disabled { background: #333; color: #777; }

  .upg-level{position:absolute;top:6px;right:6px;font-size:10px;font-weight:900; background:rgba(0,240,255,0.2);color:var(--neon-cyan); border-radius:6px;padding:2px 6px;}

  .prestige-box{text-align:center; margin-top: 5px;}
  .btn{border:none;border-radius:10px;padding:10px;width:100%;font-weight:900;font-size:13px; color:#0a0416;background:linear-gradient(135deg,var(--neon-yellow),var(--neon-pink));}
  .btn:disabled{opacity:.5; background:#444;}

  .ach{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:6px; border-radius:10px;background:rgba(255,255,255,0.05);}
  .ach.unlocked{background:rgba(255,225,77,0.15); border:1px solid rgba(255,225,77,0.4);}
  .ach .em{font-size:18px; opacity: 0.5;}
  .ach.unlocked .em{opacity:1;}
  .ach .txt b{display:block;color:#fff;font-size:12px;}
  .ach .txt span{color:var(--text-dim);font-size:10px;}

  /* УВЕДОМЛЕНИЯ */
  #toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2500;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:300px;}
  .toast{background:rgba(20,8,40,0.95); border:1px solid var(--neon-yellow); border-radius:10px; padding:10px; font-size:12px; font-weight:800; animation:toastIn .3s; text-align:center;}
  @keyframes toastIn{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}

  /* ПРОФИЛЬ */
  #profile-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2002; align-items: center; justify-content: center; }
  .modal-content { background: #120724; padding: 20px; border-radius: 15px; border: 2px solid var(--neon-pink); width: 90%; max-width: 350px; }
  .modal-content h2 { color: var(--neon-cyan); margin-bottom: 15px; text-transform: uppercase; font-size: 18px; }
  .modal-content input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #555; background: #0a0416; color: white; margin-bottom: 15px; }
  .modal-buttons { display: flex; gap: 10px; }

  /* АДАПТАЦИЯ ПОД ПК (ЧТОБЫ НА КОМПЕ БЫЛО КРАСИВО) */
  @media (min-width: 900px) {
    #game-ui { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; grid-template-areas: "header header" "main side"; gap: 20px; padding: 20px; }
    header { grid-area: header; padding: 15px 25px; }
    main { grid-area: main; }
    aside { grid-area: side; height: 100%; flex: none; }
    #click-stage { max-width: 500px; }
    .tabs { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="bg-overlay"></div>
<div id="toasts"></div>

<!-- ОКНО ОБНОВЛЕНИЯ -->
<div id="update-modal">
  <div class="update-box">
    <h2>🚀 Доступно обновление!</h2>
    <p>Вышла новая версия игры. Нажмите кнопку ниже, чтобы обновиться и играть с новыми функциями.</p>
    <button onclick="location.reload(true)">Обновить сейчас</button>
    <button class="cancel" onclick="document.getElementById('update-modal').style.display='none'">Позже</button>
  </div>
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu">
  <h1>GTA VI<br>Clicker</h1>
  <button class="menu-btn primary" id="btn-start">▶ Играть</button>
  <button class="menu-btn" id="btn-settings">⚙ Настройки</button>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings-panel">
  <h1 style="color:var(--neon-cyan); margin-bottom: 20px;">Настройки</h1>
  <button class="menu-btn" id="btn-toggle-sound">🔊 Звук: ВКЛ</button>
  <button class="menu-btn" id="btn-reset" style="border-color: #ff4444; color: #ff4444;">🗑 Сбросить прогресс</button>
  <button class="menu-btn" id="btn-close-settings">← Назад</button>
</div>

<!-- ИГРА -->
<div id="game-ui">
  <header>
    <div style="display:flex; gap:8px; align-items:center; width: 100%; justify-content: space-between;">
      <div style="display:flex; gap:8px;">
        <button class="stat-pill" id="btn-menu" style="cursor:pointer; background:#555;">☰ Меню</button>
        <div class="logo" style="display:none; @media(min-width:600px){display:block;}">🌴 Clicker</div>
      </div>
      <div style="display:flex; gap:5px; flex-wrap: wrap; justify-content: flex-end;">
        <div class="stat-pill cash"><span>💵</span><span id="stat-cash">0</span></div>
        <div class="stat-pill heat"><span>🔥</span><span id="stat-heat">x1.0</span></div>
        <div class="stat-pill respect"><span>⭐</span><span id="stat-respect">0</span></div>
      </div>
    </div>
  </header>

  <main>
    <div id="click-stage">
      <div class="neon-ring"></div>
      <div id="click-target">🌴</div>
    </div>
    <div class="combo-wrap">
      <div class="combo-label"><span>Комбо</span><b id="combo-text">x1.0</b></div>
      <div class="combo-track"><div class="combo-fill" id="combo-fill"></div></div>
    </div>
  </main>

  <aside>
    <div class="panel-title">🏙️ Империя</div>
    <div class="tabs">
      <div class="tab active" data-tab="upgrades">⚔️ Апгрейды</div>
      <div class="tab" data-tab="business">🏢 Бизнес</div>
      <div class="tab" data-tab="achievements">🏆 Ачивки</div>
    </div>
    
    <div class="tab-content active" id="tab-upgrades"></div>
    <div class="tab-content" id="tab-business"></div>
    <div class="tab-content" id="tab-achievements"></div>
    
    <div class="prestige-box">
      <button class="btn" id="prestige-btn" disabled>🏦 Ограбить город (<span id="prestige-gain">0</span>)</button>
    </div>
  </aside>
</div>

<div id="profile-modal">
  <div class="modal-content">
    <h2>Профиль</h2>
    <input type="text" id="input-nick" placeholder="Твой ник...">
    <div class="modal-buttons">
      <button class="btn" id="save-profile">Сохранить</button>
      <button class="btn" id="close-modal" style="background:#444; color:white;">Закрыть</button>
    </div>
  </div>
</div>

<script>
"use strict";

// ==========================================
// СИСТЕМА АВТООБНОВЛЕНИЯ
// ==========================================
const CURRENT_VERSION = "1.1"; // МЕНЯЙ ЭТО ЧИСЛО ПРИ ОБНОВЛЕНИИ
const GITHUB_VERSION_URL = "https://raw.githubusercontent.com/vaskovmihail08-bot/gta-clicer/main/version.txt";

async function checkForUpdates() {
  try {
    const response = await fetch(GITHUB_VERSION_URL + "?t=" + Date.now());
    if (!response.ok) return;
    const text = await response.text();
    const latestVersion = text.trim();
    if (latestVersion && latestVersion !== CURRENT_VERSION) {
      document.getElementById('update-modal').style.display = 'flex';
    }
  } catch (e) { console.log("Нет сети для проверки обновлений"); }
}
setTimeout(checkForUpdates, 1500);
// ==========================================

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return Math.floor(n);
  const tier = Math.floor(Math.log10(n)/3);
  const scaled = n / Math.pow(1000, tier);
  return scaled.toFixed(1) + ['','K','M','B','T','Qa'][tier];
}

const SAVE_KEY = 'gta6_clicker_vice_v5';
const DEFAULT_STATE = {
  cash: 0, totalCash: 0, respect: 0, prestigeCount: 0, clicks: 0, combo: 0, comboTimer: 0,
  upgrades: {}, businesses: {}, achievements: {}, soundOn: true,
  profile: { nickname: 'Игрок_' + Math.floor(Math.random() * 999) }
};

let state = JSON.parse(localStorage.getItem(SAVE_KEY)) || JSON.parse(JSON.stringify(DEFAULT_STATE));

const UPGRADES = [
  {id:'knuckles', name:'Кастет', icon:'👊', desc:'+1 к клику', baseCost:15, power:1},
  {id:'bat', name:'Бита', icon:'🏏', desc:'+3 к клику', baseCost:120, power:3},
  {id:'pistol', name:'Пистолет', icon:'🔫', desc:'+12 к клику', baseCost:1100, power:12}
];
const BUSINESSES = [
  {id:'hotdog', name:'Хот-дог', icon:'🌭', desc:'+1 $/сек', baseCost:50, income:1},
  {id:'bar', name:'Бар', icon:'🍹', desc:'+6 $/сек', baseCost:600, income:6}
];

function getUpgCost(u) { return Math.floor(u.baseCost * Math.pow(1.15, state.upgrades[u.id] || 0)); }
function getBusCost(b) { return Math.floor(b.baseCost * Math.pow(1.15, state.businesses[b.id] || 0)); }
function getClickPower() { let p = 1; UPGRADES.forEach(u => p += u.power * (state.upgrades[u.id] || 0)); return p; }
function getIncome() { let i = 0; BUSINESSES.forEach(b => i += b.income * (state.businesses[b.id] || 0)); return i; }

// Элементы
const elCash = $('#stat-cash'), elHeat = $('#stat-heat'), elRespect = $('#stat-respect');
const elComboText = $('#combo-text'), elComboFill = $('#combo-fill');
const elClickTarget = $('#click-target'), elStage = $('#click-stage');
const elTabUpg = $('#tab-upgrades'), elTabBus = $('#tab-business');

function handleClick(e) {
  e.preventDefault();
  state.clicks++; state.combo++;
  const comboMult = 1 + Math.min(state.combo, 100) * 0.02;
  const power = getClickPower() * comboMult;
  state.cash += power; state.totalCash += power;

  const rect = elStage.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  
  const el = document.createElement('div'); el.className = 'float-num'; el.textContent = '+' + fmt(power);
  el.style.left = x + 'px'; el.style.top = y + 'px'; elStage.appendChild(el);
  setTimeout(() => el.remove(), 800);

  elClickTarget.classList.remove('pressed');
  void elClickTarget.offsetWidth;
  elClickTarget.classList.add('pressed');
  
  if(state.combo > 100) state.combo = 100;
  updateUI();
}

function buyUpg(u) {
  const cost = getUpgCost(u);
  if(state.cash >= cost) { state.cash -= cost; state.upgrades[u.id] = (state.upgrades[u.id] || 0) + 1; renderUpgrades(); updateUI(); }
}

function buyBus(b) {
  const cost = getBusCost(b);
  if(state.cash >= cost) { state.cash -= cost; state.businesses[b.id] = (state.businesses[b.id] || 0) + 1; renderBusinesses(); updateUI(); }
}

function renderUpgrades() {
  let html = '';
  UPGRADES.forEach(u => {
    const lvl = state.upgrades[u.id] || 0;
    const cost = getUpgCost(u);
    html += `
      <div class="upg-card">
        <div class="upg-icon">${u.icon}</div>
        <div class="upg-info">
          <div class="upg-name">${u.name} <span style="color:var(--neon-cyan); font-size:10px;">Lv.${lvl}</span></div>
          <div class="upg-desc">${u.desc}</div>
          <div class="upg-cost">💵 ${fmt(cost)}</div>
          <button class="buy-btn" ${state.cash >= cost ? '' : 'disabled'} onclick="buyUpg({id:'${u.id}', baseCost:${u.baseCost}, power:${u.power}})">КУПИТЬ</button>
        </div>
      </div>
    `;
  });
  elTabUpg.innerHTML = html;
}

function renderBusinesses() {
  let html = '';
  BUSINESSES.forEach(b => {
    const lvl = state.businesses[b.id] || 0;
    const cost = getBusCost(b);
    html += `
      <div class="upg-card">
        <div class="upg-icon">${b.icon}</div>
        <div class="upg-info">
          <div class="upg-name">${b.name} <span style="color:var(--neon-cyan); font-size:10px;">Lv.${lvl}</span></div>
          <div class="upg-desc">${b.desc}</div>
          <div class="upg-cost">💵 ${fmt(cost)}</div>
          <button class="buy-btn" ${state.cash >= cost ? '' : 'disabled'} onclick="buyBus({id:'${b.id}', baseCost:${b.baseCost}, income:${b.income}})">КУПИТЬ</button>
        </div>
      </div>
    `;
  });
  elTabBus.innerHTML = html;
}

let lastFrame = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  
  state.cash += getIncome() * dt;
  state.totalCash += getIncome() * dt;
  
  if(state.combo > 0) {
    state.comboTimer -= dt;
    if(state.comboTimer <= 0) { state.combo = 0; }
  }
  
  updateUI();
  requestAnimationFrame(gameLoop);
}

let uiTick = 0;
function updateUI() {
  elCash.textContent = fmt(state.cash);
  const comboMult = 1 + Math.min(state.combo, 100) * 0.02;
  elHeat.textContent = 'x' + comboMult.toFixed(1);
  elComboText.textContent = 'x' + comboMult.toFixed(1);
  elComboFill.style.width = Math.min(100, (state.combo / 100) * 100) + '%';
  elRespect.textContent = fmt(state.respect);
  
  const gain = state.totalCash < 1e6 ? 0 : Math.floor(Math.pow(state.totalCash / 1e6, 0.6));
  $('#prestige-gain').textContent = fmt(gain);
  $('#prestige-btn').disabled = gain <= 0;
  
  uiTick++;
  if(uiTick % 30 === 0) { renderUpgrades(); renderBusinesses(); saveState(); }
}

function saveState() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

// Слушатели
elStage.addEventListener('mousedown', handleClick);
elStage.addEventListener('touchstart', handleClick, {passive: false});

$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    $$('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    $('#tab-' + tab.dataset.tab).classList.add('active');
  });
});

$('#btn-start').addEventListener('click', () => { $('#main-menu').style.display = 'none'; $('#game-ui').style.display = 'flex'; });
$('#btn-menu').addEventListener('click', () => { $('#main-menu').style.display = 'flex'; $('#game-ui').style.display = 'none'; });
$('#btn-settings').addEventListener('click', () => { $('#settings-panel').style.display = 'flex'; $('#main-menu').style.display = 'none'; });
$('#btn-close-settings').addEventListener('click', () => { $('#settings-panel').style.display = 'none'; $('#main-menu').style.display = 'flex'; });
$('#btn-reset').addEventListener('click', () => { if(confirm('Удалить прогресс?')) { localStorage.removeItem(SAVE_KEY); location.reload(); } });

// Запуск
renderUpgrades();
renderBusinesses();
updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GTA VI Clicker — Vice City Hustle</title>
<style>
  :root{
    --neon-pink:#ff2e97; --neon-cyan:#00f0ff; --neon-purple:#a855f7;
    --neon-yellow:#ffe14d; --neon-green:#39ff88; --bg-dark:#0a0416;
    --bg-panel:rgba(20,8,40,0.95); --glass:rgba(255,255,255,0.08);
    --text-main:#f4eaff; --text-dim:#b9a8d6; --radius:18px;
    --font:'Segoe UI','Trebuchet MS',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden; touch-action: manipulation; background:var(--bg-dark);}
  body{font-family:var(--font);color:var(--text-main);user-select:none;position:relative;}

  /* ФОН */
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;}
  #bg-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;
    background: radial-gradient(ellipse at 20% 0%, rgba(255,46,151,0.18), transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(0,240,255,0.14), transparent 55%),
                radial-gradient(ellipse at 50% 110%, rgba(168,85,247,0.20), transparent 60%),
                linear-gradient(180deg, rgba(10,4,22,0.15) 0%, rgba(10,4,22,0.55) 70%, rgba(10,4,22,0.92) 100%);}

  /* ГЛАВНОЕ МЕНЮ */
  #main-menu { position: fixed; inset: 0; z-index: 2000; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px; overflow-y: auto; }
  #main-menu h1 { font-size: clamp(32px, 8vw, 64px); font-weight: 900; letter-spacing: 4px; text-transform: uppercase; text-align: center; line-height: 1.1; background: linear-gradient(90deg,var(--neon-pink),var(--neon-yellow),var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(255,46,151,0.5)); margin-bottom: 20px; }
  .menu-btn { width: 100%; max-width: 300px; padding: 16px; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); color: white; cursor: pointer; transition: all 0.2s; text-align: center; }
  .menu-btn.primary { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); border: none; box-shadow: 0 0 20px rgba(255,46,151,0.4); }

  /* МОДАЛЬНЫЕ ОКНА */
  .modal-overlay { position: fixed; inset: 0; z-index: 2001; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; padding: 15px; }
  .modal-box { background: #120724; padding: 20px; border-radius: 20px; border: 2px solid var(--neon-pink); width: 100%; max-width: 380px; box-shadow: 0 0 50px rgba(255,46,151,0.4); text-align: center; max-height: 90vh; overflow-y: auto; }
  .modal-btn { width: 100%; padding: 14px; margin-bottom: 10px; font-size: 14px; font-weight: 800; text-transform: uppercase; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
  .modal-btn.primary { background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple)); color: white; }
  .modal-btn.secondary { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.2); }
  .modal-btn.danger { background: transparent; color: #ff4444; border-color: #ff4444; }
  .modal-input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #0a0416; color: white; margin-bottom: 15px; font-family: var(--font); font-size: 16px; }
  .modal-buttons-row { display: flex; gap: 10px; }

  /* ИГРА */
  #game-ui { position: relative; z-index: 2; height: 100%; display: none; flex-direction: column; padding: 10px; gap: 10px; overflow: hidden; }
  header{display:flex;align-items:center;justify-content:space-between; gap:10px;flex-wrap:wrap;background:var(--bg-panel);border:1px solid rgba(255,46,151,0.5); border-radius:var(--radius);padding:10px 15px; flex-shrink: 0;}
  .header-stats{display:flex;gap:6px;flex-wrap:wrap;align-items:center; justify-content: flex-end; flex: 1;}
  .stat-pill{background:rgba(255,255,255,0.1); border-radius:999px;padding:6px 10px; display:flex;align-items:center;gap:5px;font-weight:800;font-size:12px; white-space:nowrap; border: none;}
  .stat-pill.cash{color:var(--neon-green);} .stat-pill.heat{color:var(--neon-pink);} .stat-pill.respect{color:var(--neon-yellow);}

  main{position:relative;display:flex;flex-direction:column; align-items:center;justify-content:center; flex: 1; min-height: 0;}
  #click-stage{position:relative;width:100%;max-width:350px;aspect-ratio:1/1; display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
  .neon-ring{position:absolute;inset:6%;border-radius:50%; border:3px solid rgba(255,46,151,0.4); box-shadow:0 0 40px rgba(255,46,151,0.4);}
  #click-target{position:relative;width:60%;height:60%;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:clamp(50px,15vw,100px); background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.3),transparent), linear-gradient(145deg,rgba(255,46,151,0.5),rgba(0,240,255,0.3)); border:2px solid rgba(255,255,255,0.4); box-shadow:0 0 50px rgba(255,46,151,0.5); transition:transform .1s;}
  #click-target.pressed{transform:scale(0.9);}
  .combo-wrap{width:100%;max-width:350px;margin-top:10px;}
  .combo-track{height:8px;border-radius:999px;background:rgba(255,255,255,0.1); overflow:hidden;}
  .combo-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--neon-cyan),var(--neon-pink));}
  .float-num{position:absolute;font-weight:900;font-size:20px; color:var(--neon-green); pointer-events:none;z-index:50; animation:floatUp .8s forwards;}
  @keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%) scale(1);} 100%{opacity:0;transform:translate(-50%,-150%) scale(1.5);}}

  /* МАГАЗИН */
  aside{flex: 0 0 45vh; display:flex;flex-direction:column; gap:10px; overflow:hidden; background:var(--bg-panel); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius); padding:12px; position: relative;}
  .tabs{display:flex; gap:5px; flex-shrink: 0; overflow-x: auto; padding-bottom: 5px;}
  .tab{flex:1; padding:8px; border-radius:8px; background:rgba(255,255,255,0.06); border:none; color:var(--text-dim); font-size:11px; font-weight:900; cursor:pointer; white-space:nowrap;}
  .tab.active{background:var(--neon-pink); color:white;}
  .tab-content{display:none; overflow-y:auto; flex:1; padding-right:5px; -webkit-overflow-scrolling: touch;}
  .tab-content.active{display:block;}
  .tab-content::-webkit-scrollbar{width:4px;}
  .tab-content::-webkit-scrollbar-thumb{background:var(--neon-pink); border-radius:2px;}
  .upg-card{background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:10px; margin-bottom:8px; display:flex; flex-direction: column; gap:6px; position:relative;}
  .upg-title{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:900; color:#fff;}
  .upg-desc{font-size:11px; color:var(--text-dim);}
  .upg-cost{font-size:13px; font-weight:900; color:var(--neon-green);}
  .buy-btn { width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: 900; font-size: 13px; color: #0a0416; background: var(--neon-green); cursor:pointer;}
  .buy-btn:disabled { background: #333; color: #777; cursor: not-allowed;}
  .upg-level{position:absolute; top:10px; right:10px; font-size:11px; color:var(--neon-cyan);}
  .skin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .skin-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px 5px; text-align: center; cursor: pointer; }
  .skin-card.active { border-color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255,225,77,0.3); }
  .ach{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px; border-radius:10px;background:rgba(255,255,255,0.05);}
  .ach.unlocked{background:rgba(255,225,77,0.15); border:1px solid var(--neon-yellow);}

  /* ================= ТУТОРИАЛ ================= */
  #tutorial-overlay { position: fixed; inset: 0; z-index: 3000; display: none; pointer-events: none; }
  .tutorial-highlight { position: absolute; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.8); z-index: 3001; pointer-events: none; transition: all 0.3s ease; border: 2px solid var(--neon-cyan); }
  #tutorial-dialog { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: #120724; border: 2px solid var(--neon-pink); border-radius: 15px; padding: 15px; z-index: 3002; pointer-events: auto; box-shadow: 0 0 30px rgba(255,46,151,0.4); display: flex; flex-direction: column; gap: 10px; }
  .tutorial-chars { display: flex; gap: 15px; align-items: flex-start; }
  .tut-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 2px solid #fff; }
  .tut-avatar.jason-img { border-color: var(--neon-cyan); }
  .tut-avatar.lucia-img { border-color: var(--neon-pink); }
  .tut-text-box { flex: 1; }
  .tut-name { font-weight: 900; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; }
  .tut-text { font-size: 14px; line-height: 1.4; color: white; }
  .tut-btn { align-self: flex-end; padding: 8px 16px; background: var(--neon-pink); border: none; border-radius: 8px; font-weight: bold; font-size: 12px; color: white; cursor: pointer; pointer-events: auto;}
  .tutorial-arrow { position: absolute; z-index: 3001; font-size: 40px; color: var(--neon-yellow); animation: bounceArrow 1s infinite; pointer-events: none; filter: drop-shadow(0 0 10px var(--neon-yellow)); }
  @keyframes bounceArrow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  @media (min-width: 900px) {
    #game-ui { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; gap: 20px; padding: 20px; }
    header { grid-column: 1 / -1; }
    aside { flex: none; height: 100%; }
    #click-stage { max-width: 450px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div id="bg-overlay"></div>

<!-- АУДИОПЛЕЕР -->
<audio id="bg-music" loop>
  <!-- https://mp3party.net/music/12339615 -->
  <source src="" type="audio/mpeg">
</audio>

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="main-menu">
  <h1>GTA VI<br>Clicker</h1>
  <button class="menu-btn primary" id="btn-start">▶ Играть</button>
  <button class="menu-btn" id="btn-profile-menu">👤 Профиль</button>
  <button class="menu-btn" id="btn-settings">⚙ Настройки</button>
  <button class="menu-btn" id="btn-music" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">🎵 Включить музыку</button>
</div>

<!-- НАСТРОЙКИ -->
<div class="modal-overlay" id="settings-panel">
  <div class="modal-box">
    <h2>Настройки</h2>
    <button class="modal-btn secondary" id="btn-save-game" style="color: var(--neon-cyan); border-color: var(--neon-cyan);">💾 Скачать сохранение</button>
    <button class="modal-btn secondary" id="btn-load-game" style="color: var(--neon-green); border-color: var(--neon-green);">📥 Загрузить сохранение</button>
    <input type="file" id="file-input" style="display:none;" accept=".json">
    <button class="modal-btn danger" id="btn-reset">🗑 Сбросить прогресс</button>
    <button class="modal-btn primary" id="btn-close-settings" style="margin-top: 10px;">← Назад</button>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal-box">
    <h2>Профиль</h2>
    <input type="text" id="input-nick" class="modal-input" placeholder="Введи ник...">
    <div class="modal-buttons-row">
      <button class="modal-btn primary" id="save-profile" style="flex:1; margin:0;">Сохранить</button>
      <button class="modal-btn secondary" id="close-modal" style="flex:1; margin:0;">Закрыть</button>
    </div>
  </div>
</div>

<!-- ИГРА -->
<div id="game-ui">
  <header>
    <button class="stat-pill" id="btn-menu" style="background:#555; cursor:pointer;">☰ Меню</button>
    <div class="header-stats">
      <div class="stat-pill cash">💵 <span id="stat-cash">0</span></div>
      <div class="stat-pill heat">🔥 <span id="stat-heat">x1.0</span></div>
      <div class="stat-pill respect">⭐ <span id="stat-respect">0</span></div>
    </div>
  </header>

  <main>
    <div id="click-stage">
      <div class="neon-ring"></div>
      <div id="click-target">🌴</div>
    </div>
    <div class="combo-wrap" id="combo-element">
      <div style="font-size:10px; display:flex; justify-content:space-between; margin-bottom:2px;"><span>Комбо</span><b id="combo-text">x1.0</b></div>
      <div class="combo-track"><div class="combo-fill" id="combo-fill"></div></div>
    </div>
  </main>

  <aside>
    <div class="tabs" id="tabs-element">
      <div class="tab active" data-tab="upgrades">⚔️ Апгрейды</div>
      <div class="tab" data-tab="business">🏢 Бизнес</div>
      <div class="tab" data-tab="skins">🎨 Скины</div>
      <div class="tab" data-tab="achievements">🏆 Ачивки</div>
    </div>
    
    <div class="tab-content active" id="tab-upgrades"></div>
    <div class="tab-content" id="tab-business"></div>
    <div class="tab-content" id="tab-skins"></div>
    <div class="tab-content" id="tab-achievements"></div>
    
    <button class="buy-btn" id="prestige-btn" style="margin-top:10px; background:var(--neon-yellow);" disabled>🏦 Ограбить город</button>
  </aside>
</div>

<!-- ОВЕРЛЕЙ ТУТОРИАЛА -->
<div id="tutorial-overlay">
  <div class="tutorial-highlight" id="tut-highlight"></div>
  <div class="tutorial-arrow" id="tut-arrow">👇</div>
  <div id="tutorial-dialog">
    <div class="tutorial-chars">
      <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&h=100&fit=crop" class="tut-avatar jason-img" id="tut-avatar-jason" alt="Jason">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop" class="tut-avatar lucia-img" id="tut-avatar-lucia" style="display:none;" alt="Lucia">
      
      <div class="tut-text-box">
        <div class="tut-name" id="tut-name">ДЖЕЙСОН</div>
        <div class="tut-text" id="tut-text">Текст...</div>
      </div>
    </div>
    <button class="tut-btn" id="tut-next-btn">Далее</button>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

const SAVE_KEY = 'gta6_clicker_vice_v10';
const DEFAULT_STATE = {
  cash: 0, totalCash: 0, respect: 0, prestigeCount: 0, clicks: 0, combo: 0, comboTimer: 0,
  upgrades: {}, businesses: {}, achievements: {}, soundOn: true, currentSkin: '🌴',
  tutorialDone: false,
  profile: { nickname: 'Игрок_' + Math.floor(Math.random() * 999) }
};

let state = JSON.parse(localStorage.getItem(SAVE_KEY)) || JSON.parse(JSON.stringify(DEFAULT_STATE));

const UPGRADES = [
  {id:'knuckles', name:'Кастет', icon:'👊', desc:'+1 к клику', baseCost:15, power:1, max:200},
  {id:'bat', name:'Бита', icon:'🏏', desc:'+3 к клику', baseCost:120, power:3, max:200},
  {id:'pistol', name:'Пистолет', icon:'🔫', desc:'+12 к клику', baseCost:1100, power:12, max:200}
];
const BUSINESSES = [
  {id:'hotdog', name:'Хот-дог', icon:'🌭', desc:'+1 $/сек', baseCost:50, income:1, max:300},
  {id:'bar', name:'Бар', icon:'🍹', desc:'+6 $/сек', baseCost:600, income:6, max:300}
];
const SKINS = [
  { id: '🌴', name: 'Пальма', cost: 0 },
  { id: '🚗', name: 'Тачка', cost: 1000 },
  { id: '🚁', name: 'Вертолет', cost: 50000 }
];
const ACHIEVEMENTS = [
  {id:'click1', name:'Первый клик', desc:'Сделать 1 клик', check:s=>s.clicks>=1},
  {id:'cash1k', name:'Первая штука', desc:'Заработать $1K', check:s=>s.totalCash>=1e3}
];

/* ========================= МУЗЫКА ========================= */
const bgMusic = $('#bg-music');
const btnMusic = $('#btn-music');

btnMusic.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().catch(e => console.log("Ошибка воспроизведения:", e));
    btnMusic.textContent = '⏸ Выключить музыку';
    btnMusic.style.borderColor = 'var(--neon-pink)';
    btnMusic.style.color = 'var(--neon-pink)';
  } else {
    bgMusic.pause();
    btnMusic.textContent = '🎵 Включить музыку';
    btnMusic.style.borderColor = 'var(--neon-cyan)';
    btnMusic.style.color = 'var(--neon-cyan)';
  }
});
/* ========================================================= */

function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 1000) return Math.floor(n);
  const tier = Math.floor(Math.log10(n)/3);
  return (n / Math.pow(1000, tier)).toFixed(1) + ['','K','M','B','T'][tier];
}

function getUpgCost(u) { return Math.floor(u.baseCost * Math.pow(1.15, state.upgrades[u.id] || 0)); }
function getBusCost(b) { return Math.floor(b.baseCost * Math.pow(1.15, state.businesses[b.id] || 0)); }
function getClickPower() { let p = 1; UPGRADES.forEach(u => p += u.power * (state.upgrades[u.id] || 0)); return p * (1 + state.prestigeCount * 0.5); }
function getIncome() { let i = 0; BUSINESSES.forEach(b => i += b.income * (state.businesses[b.id] || 0)); return i * (1 + state.prestigeCount * 0.5); }

const elCash = $('#stat-cash'), elHeat = $('#stat-heat'), elRespect = $('#stat-respect');
const elComboText = $('#combo-text'), elComboFill = $('#combo-fill');
const elClickTarget = $('#click-target'), elStage = $('#click-stage');

function handleClick(e) {
  e.preventDefault();
  state.clicks++; state.combo++; state.comboTimer = 2.0;
  const comboMult = 1 + Math.min(state.combo, 100) * 0.02;
  const power = getClickPower() * comboMult;
  state.cash += power; state.totalCash += power;

  const rect = elStage.getBoundingClientRect();
  const x = (e.clientX || e.touches[0].clientX) - rect.left;
  const y = (e.clientY || e.touches[0].clientY) - rect.top;
  
  const el = document.createElement('div'); el.className = 'float-num'; el.textContent = '+' + fmt(power);
  el.style.left = x + 'px'; el.style.top = y + 'px'; elStage.appendChild(el);
  setTimeout(() => el.remove(), 800);

  elClickTarget.classList.remove('pressed'); void elClickTarget.offsetWidth; elClickTarget.classList.add('pressed');
  if(state.combo > 100) state.combo = 100;
  updateUI();
}

function buyUpg(u) {
  const cost = getUpgCost(u);
  if(state.cash >= cost && (state.upgrades[u.id]||0) < u.max) {
    state.cash -= cost; state.upgrades[u.id] = (state.upgrades[u.id] || 0) + 1;
    renderStore(); updateUI();
  }
}

function buyBus(b) {
  const cost = getBusCost(b);
  if(state.cash >= cost && (state.businesses[b.id]||0) < b.max) {
    state.cash -= cost; state.businesses[b.id] = (state.businesses[b.id] || 0) + 1;
    renderStore(); updateUI();
  }
}

function buySkin(skin) {
  if(state.cash >= skin.cost) {
    state.cash -= skin.cost; state.currentSkin = skin.id;
    elClickTarget.textContent = skin.id;
    renderStore(); updateUI();
  }
}

function renderStore() {
  let htmlU = '';
  UPGRADES.forEach(u => {
    const lvl = state.upgrades[u.id] || 0; const cost = getUpgCost(u);
    htmlU += `<div class="upg-card"><div class="upg-level">Lv.${lvl}</div><div class="upg-title">${u.icon} ${u.name}</div><div class="upg-desc">${u.desc}</div><div class="upg-cost">💵 ${fmt(cost)}</div><button class="buy-btn" ${state.cash >= cost && lvl < u.max ? '' : 'disabled'} onclick="buyUpg({id:'${u.id}', baseCost:${u.baseCost}, power:${u.power}, max:${u.max}})">КУПИТЬ</button></div>`;
  });
  $('#tab-upgrades').innerHTML = htmlU;

  let htmlB = '';
  BUSINESSES.forEach(b => {
    const lvl = state.businesses[b.id] || 0; const cost = getBusCost(b);
    htmlB += `<div class="upg-card"><div class="upg-level">Lv.${lvl}</div><div class="upg-title">${b.icon} ${b.name}</div><div class="upg-desc">${b.desc}</div><div class="upg-cost">💵 ${fmt(cost)}</div><button class="buy-btn" ${state.cash >= cost && lvl < b.max ? '' : 'disabled'} onclick="buyBus({id:'${b.id}', baseCost:${b.baseCost}, income:${b.income}, max:${b.max}})">КУПИТЬ</button></div>`;
  });
  $('#tab-business').innerHTML = htmlB;

  let htmlS = '<div class="skin-grid">';
  SKINS.forEach(s => {
    const isActive = state.currentSkin === s.id;
    const canBuy = state.cash >= s.cost;
    let btnText = isActive ? 'ВЫБРАНО' : (s.cost === 0 ? 'ВЫБРАТЬ' : (canBuy ? `КУПИТЬ` : `НУЖНО ${fmt(s.cost)}`));
    htmlS += `<div class="skin-card ${isActive ? 'active' : ''}" onclick="${isActive ? '' : `buySkin({id:'${s.id}', cost:${s.cost}})`}"><div class="skin-emoji">${s.id}</div><div style="font-size:10px; font-weight:bold; margin:5px 0;">${s.name}</div><div style="font-size:9px; color:${isActive ? 'var(--neon-yellow)' : 'var(--neon-cyan)'}">${btnText}</div></div>`;
  });
  htmlS += '</div>';
  $('#tab-skins').innerHTML = htmlS;

  let htmlA = '';
  ACHIEVEMENTS.forEach(a => {
    const un = state.achievements[a.id];
    htmlA += `<div class="ach ${un ? 'unlocked' : ''}"><div class="em">${un ? '🏆' : '🔒'}</div><div class="txt"><b>${a.name}</b><br><span>${a.desc}</span></div></div>`;
  });
  $('#tab-achievements').innerHTML = htmlA;
}

function checkAchievements() {
  let changed = false;
  ACHIEVEMENTS.forEach(a => {
    if(!state.achievements[a.id] && a.check(state)) {
      state.achievements[a.id] = true; changed = true;
    }
  });
  if(changed) renderStore();
}

let lastFrame = performance.now();
function gameLoop(now) {
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  
  const inc = getIncome();
  if(inc > 0) { state.cash += inc * dt; state.totalCash += inc * dt; }
  
  if(state.combo > 0) { state.comboTimer -= dt; if(state.comboTimer <= 0) state.combo = 0; }
  
  updateUI();
  requestAnimationFrame(gameLoop);
}

let uiTick = 0;
function updateUI() {
  elCash.textContent = fmt(state.cash);
  const comboMult = 1 + Math.min(state.combo, 100) * 0.02;
  elHeat.textContent = 'x' + comboMult.toFixed(1);
  elComboText.textContent = 'x' + comboMult.toFixed(1);
  elComboFill.style.width = Math.min(100, (state.combo / 100) * 100) + '%';
  elRespect.textContent = fmt(state.respect);
  
  uiTick++;
  if(uiTick % 20 === 0) { renderStore(); checkAchievements(); saveState(); }
}

function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

/* ИНТЕРФЕЙС */
elStage.addEventListener('mousedown', handleClick);
elStage.addEventListener('touchstart', handleClick, {passive: false});

$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    $$('.tab').forEach(t => t.classList.remove('active'));
    $$('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    $('#tab-' + tab.dataset.tab).classList.add('active');
  });
});

$('#btn-start').addEventListener('click', () => { 
  $('#main-menu').style.display = 'none'; 
  $('#game-ui').style.display = 'flex'; 
  if(!state.tutorialDone) startTutorial();
});

$('#btn-menu').addEventListener('click', () => { $('#main-menu').style.display = 'flex'; $('#game-ui').style.display = 'none'; });
$('#btn-settings').addEventListener('click', () => { $('#settings-panel').style.display = 'flex'; });
$('#btn-close-settings').addEventListener('click', () => { $('#settings-panel').style.display = 'none'; });

const openProfile = () => { $('#input-nick').value = state.profile.nickname; $('#profile-modal').style.display = 'flex'; };
$('#btn-profile-menu').addEventListener('click', openProfile);
$('#close-modal').addEventListener('click', () => { $('#profile-modal').style.display = 'none'; });
$('#save-profile').addEventListener('click', () => {
  state.profile.nickname = $('#input-nick').value || 'Игрок';
  $('#profile-modal').style.display = 'none';
  saveState();
});

$('#btn-reset').addEventListener('click', () => { if(confirm('Удалить прогресс?')) { localStorage.removeItem(SAVE_KEY); location.reload(); } });

// ТУТОРИАЛ
let tutIndex = 0;
const TUTORIAL_STEPS = [
  { speaker: 'jason', text: 'Здарова! Я Джейсон. Это Вайс-Сити, тут крутятся большие деньги.', target: null },
  { speaker: 'lucia', text: 'А я Люси. Видишь пальму? Жми на неё!', target: '#click-target', arrow: '👇' },
  { speaker: 'jason', text: 'Каждый клик — это деньги. Старайся кликать быстро, чтобы рос множитель комбо!', target: '#combo-element', arrow: '👇' },
  { speaker: 'lucia', text: 'Когда накопишь немного баксов, загляни в магазин. Купи пушки.', target: '#tabs-element', arrow: '👇' },
  { speaker: 'jason', text: 'А если хочешь, чтобы деньги капали сами — покупай бизнесы.', target: null },
  { speaker: 'lucia', text: 'И самое главное — вкладка "Скины". Пальму можно заменить на машину!', target: null },
  { speaker: 'jason', text: 'Всё, база есть. Дальше сам.', target: '#btn-menu', arrow: '👆' }
];

function startTutorial() {
  tutIndex = 0;
  $('#tutorial-overlay').style.display = 'block';
  $$('.tab').forEach(t => t.classList.remove('active'));
  $$('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector('.tab[data-tab="upgrades"]').classList.add('active');
  $('#tab-upgrades').classList.add('active');
  showTutorialStep();
}

function showTutorialStep() {
  if (tutIndex >= TUTORIAL_STEPS.length) {
    $('#tutorial-overlay').style.display = 'none';
    state.tutorialDone = true;
    saveState();
    return;
  }

  const step = TUTORIAL_STEPS[tutIndex];
  const imgJason = $('#tut-avatar-jason');
  const imgLucia = $('#tut-avatar-lucia');
  const name = $('#tut-name');
  const text = $('#tut-text');
  const highlight = $('#tut-highlight');
  const arrow = $('#tut-arrow');

  text.textContent = step.text;
  
  if (step.speaker === 'lucia') {
    imgJason.style.display = 'none'; imgLucia.style.display = 'block';
    name.textContent = 'ЛЮСИ'; name.style.color = 'var(--neon-pink)';
  } else {
    imgJason.style.display = 'block'; imgLucia.style.display = 'none';
    name.textContent = 'ДЖЕЙСОН'; name.style.color = 'var(--neon-cyan)';
  }

  if (step.target) {
    const el = $(step.target);
    if (el) {
      const rect = el.getBoundingClientRect();
      highlight.style.display = 'block';
      highlight.style.left = (rect.left - 5) + 'px';
      highlight.style.top = (rect.top - 5) + 'px';
      highlight.style.width = (rect.width + 10) + 'px';
      highlight.style.height = (rect.height + 10) + 'px';

      arrow.style.display = 'block';
      arrow.textContent = step.arrow || '👇';
      arrow.style.left = (rect.left + rect.width / 2 - 20) + 'px';
      arrow.style.top = (rect.top - 60) + 'px';
    }
  } else {
    highlight.style.display = 'none';
    arrow.style.display = 'none';
  }

  $('#tut-next-btn').textContent = (tutIndex === TUTORIAL_STEPS.length - 1) ? 'Завершить' : 'Далее';
}

$('#tut-next-btn').addEventListener('click', () => { tutIndex++; showTutorialStep(); });

// Инициализация
elClickTarget.textContent = state.currentSkin || '🌴';
renderStore();
updateUI();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
